<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple web UI — reference implementation</title>
<!-- Working example of every recipe in ios-components.css.
     Open it in a browser to check a change didn't break the look.
     Verified at 430px wide in light and dark by scripts/verify_web_ui.py.

     The artwork behind the bars is deliberate. Liquid Glass is a
     refraction, so it has nothing to do on a flat page -- put it over a
     plain background and it collapses to a grey box. Anything with
     colour and edges moving under it shows what the material is for. -->
<link rel="stylesheet" href="tokens/ios-tokens.css">
<link rel="stylesheet" href="ios-components.css">
<style>
  .hero {
    height: 300px;
    margin-top: -64px;
    background:
      radial-gradient(90% 70% at 18% 12%, #FF6B9D 0%, transparent 60%),
      radial-gradient(80% 60% at 85% 8%, #FFB340 0%, transparent 55%),
      radial-gradient(70% 70% at 70% 80%, #5E5CE6 0%, transparent 60%),
      linear-gradient(160deg, #0A84FF, #30D158);
  }
  .hero__text {
    padding: 96px var(--ios-gutter) 0;
    color: #fff;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .25);
  }
  .hero__text h1 { font: var(--ios-text-large-title); font-weight: 700; margin: 0; }
  .hero__text p  { font: var(--ios-text-subhead); margin: 4px 0 0; opacity: .92; }

  .float {
    position: sticky;
    bottom: 84px;
    z-index: 9;
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: -22px 0 24px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 var(--ios-gutter) 20px; }
  .section-title { font: var(--ios-text-title2); font-weight: 700;
                   margin: 28px var(--ios-gutter) 12px; }
  main { padding-bottom: 40px; }
  /* Nav actions stay 44px tall for the hit region even though they
     read as plain text -- the padding is horizontal only. */
  .ios-navbar__action { padding: 0 8px; }
</style>

<nav class="ios-navbar">
  <button class="ios-btn ios-navbar__action">Edit</button>
  <span class="ios-navbar__title">Today</span>
  <button class="ios-btn ios-navbar__action" aria-label="Add">＋</button>
</nav>

<div class="hero">
  <div class="hero__text">
    <h1>Good morning</h1>
    <p>Three habits left · 68% this week</p>
  </div>
</div>

<div class="float">
  <button class="ios-glass ios-glass--light ios-glass-btn ios-glass--capsule">✦ Focus</button>
  <button class="ios-glass ios-glass--prominent ios-glass-btn ios-glass--capsule" aria-label="Add">＋</button>
</div>

<main>
  <div class="row">
    <button class="ios-btn ios-btn--filled">Continue</button>
    <button class="ios-btn ios-btn--tinted">Learn More</button>
    <button class="ios-btn">Cancel</button>
    <button class="ios-btn ios-btn--filled ios-btn--destructive">Delete</button>
    <button class="ios-btn ios-btn--filled" disabled>Disabled</button>
  </div>

  <div class="ios-list__header">Notifications</div>
  <ul class="ios-list">
    <li class="ios-list__row"><span class="ios-list__title">Allow Notifications</span>
      <label class="ios-switch"><input type="checkbox" checked><span class="ios-switch__track"></span></label></li>
    <li class="ios-list__row"><span class="ios-list__title">Sounds</span>
      <label class="ios-switch"><input type="checkbox"><span class="ios-switch__track"></span></label></li>
    <li class="ios-list__row ios-list__row--tappable"><span class="ios-list__title">Alert Style</span>
      <span class="ios-list__value">Banners</span><span class="ios-list__chevron">›</span></li>
    <li class="ios-list__row"><span class="ios-list__title">Badge</span>
      <label class="ios-switch"><input type="checkbox" checked disabled><span class="ios-switch__track"></span></label></li>
  </ul>
  <div class="ios-list__footer">Alerts appear on the Lock Screen and in Notification Center.</div>

  <div class="ios-list__header">Account</div>
  <ul class="ios-list">
    <li class="ios-list__row"><input class="ios-field" placeholder="Email address"></li>
  </ul>

  <div class="section-title">Materials</div>
  <div class="row">
    <div class="ios-glass ios-glass--card" style="padding:20px;flex:1">
      <strong>Regular</strong><br>
      <span style="color:var(--ios-label-secondary);font:var(--ios-text-footnote)">
        rim, falloff, ambient shadow</span>
    </div>
    <div class="ios-glass ios-glass--dark ios-glass--card" style="padding:20px;flex:1">
      <strong>Dark</strong><br>
      <span style="color:var(--ios-label-secondary);font:var(--ios-text-footnote)">
        heavier tint · a=46/255</span>
    </div>
  </div>

  <div class="row">
    <div class="ios-segmented">
      <label><input type="radio" name="s" checked><span></span>Day</label>
      <label><input type="radio" name="s"><span></span>Week</label>
      <label><input type="radio" name="s"><span></span>Month</label>
    </div>
  </div>
</main>

<nav class="ios-tabbar">
  <button class="ios-tabbar__item" aria-selected="true"><span>◉</span>Today</button>
  <button class="ios-tabbar__item"><span>▤</span>History</button>
  <button class="ios-tabbar__item"><span>⚙</span>Settings</button>
</nav>
