name: release

# Pushing a tag such as v1.0.0 publishes that release, once everything
# below has passed:
#
#   - the whole suite in checks.yml, as on every push
#   - the tag is a version (v1.2.3), on main, and install.sh and the
#     plugin's version say the same
#   - nothing of Apple's in the tree, and every third-party file matches
#     its licence, with Material Symbols compared against their source
#
# The installer attached to the release has the release's commit written
# in, so it can check that what it downloads is exactly what was released.
# A file can't hold its own commit's ID, which is why it's built here
# rather than committed. Alongside it go licences.json (every third-party
# file, its licence, holder and source) and files.sha256 (every file in
# the release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read fonts' name tables
        run: python -m pip install --quiet fonttools brotli

      - name: The tag is a version on main, and install.sh agrees
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags look like v1.2.3, not $GITHUB_REF_NAME"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main"; exit 1
          fi
          if ! grep -q "^VERSION=\"${GITHUB_REF_NAME}\"$" install.sh; then
            echo "::error::install.sh has $(grep '^VERSION=' install.sh); set it to ${GITHUB_REF_NAME} first"; exit 1
          fi
          plugin=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v${plugin}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::.claude-plugin/plugin.json has version ${plugin}; set it to ${GITHUB_REF_NAME#v} first"; exit 1
          fi

      - name: Nothing of Apple's copied in
        run: python scripts/provenance_guard.py

      - name: Every third-party file against its licence and source
        run: |
          mkdir dist
          python scripts/check_licences.py --upstream --json dist/licences.json

      - name: Pin the installer to this release
        run: |
          sed -e "s/^VERSION=\".*\"/VERSION=\"${GITHUB_REF_NAME}\"/" \
              -e "s/^COMMIT=\"\"/COMMIT=\"${GITHUB_SHA}\"/" install.sh > dist/install.sh
          grep -q "^COMMIT=\"${GITHUB_SHA}\"$" dist/install.sh
          grep -q "^VERSION=\"${GITHUB_REF_NAME}\"$" dist/install.sh
          bash -n dist/install.sh
          git ls-files -z | xargs -0 sha256sum > dist/files.sha256
          (cd dist && sha256sum install.sh licences.json files.sha256 > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum=$(grep ' install.sh$' dist/SHA256SUMS | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/licences.json \
            dist/files.sha256 dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "Install this release:

          \`\`\`bash
          curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh
          less install.sh
          bash install.sh
          \`\`\`

          The installer checks it is installing commit \`${GITHUB_SHA}\`.
          SHA-256 of install.sh: \`${sum}\`

          licences.json lists every third-party file in this release with its licence, copyright holder and source; files.sha256 has the checksum of every file."
