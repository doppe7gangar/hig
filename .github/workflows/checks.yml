name: checks

# Every push to main and every pull request runs the whole suite, and so
# does every release before it is published (release.yml calls this). The
# provenance step comes first: Apple's text or images turning up fails the
# build before anything else runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Nothing of Apple's copied in
        run: python3 scripts/provenance_guard.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --quiet playwright pillow fonttools brotli
          python -m playwright install --with-deps chromium

      - name: Installer parses
        run: bash -n install.sh

      - name: iPhone kit
        run: python .claude/skills/apple-ui-kit/verify_web_ui.py

      - name: iPad kit
        run: python .claude/skills/apple-ui-kit/verify_ipad_ui.py

      - name: Mac kit
        run: python .claude/skills/apple-ui-kit/verify_mac_ui.py

      - name: iPhone screens against Apple's examples
        run: python .claude/skills/apple-ui-kit/verify_ios_screens.py

      - name: Android kit
        run: python .claude/skills/android-ui-kit/verify_android_ui.py

      - name: Design workflow
        run: python scripts/eval/design_workflow_smoke.py

      - name: SwiftUI checker
        run: python scripts/eval/test_check_swiftui.py

      - name: Quote checker
        run: python scripts/eval/test_check_quotes.py

      - name: React components
        run: python scripts/eval/test_react_kit.py

      - name: Tailwind theme
        run: python scripts/eval/test_tailwind_theme.py

      - name: What a design hands on
        run: python scripts/eval/test_check_distribution.py

      - name: Third-party licences
        run: |
          python scripts/check_licences.py
          python scripts/eval/test_check_licences.py

      - name: The plugin, its hooks and the GitHub Action
        run: |
          npm install --global --silent @anthropic-ai/claude-code@^2
          python scripts/eval/test_plugin.py

      - name: Docs match the files
        run: python scripts/doctor.py

  action:
    # The GitHub Action as other repositories use it: it has to pass clean
    # work and fail an app with seeded HIG violations.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Something clean to check
        run: |
          python3 .claude/skills/apple-design/new_project.py --name Pantry --brand "#C1552E" \
            --kind ios --model tabs -o "$RUNNER_TEMP/design"
          mkdir -p "$RUNNER_TEMP/clean"
          printf 'import SwiftUI\n\nstruct V: View {\n    var body: some View {\n        Text("Hello").font(.body)\n    }\n}\n' > "$RUNNER_TEMP/clean/V.swift"

      - name: The action passes clean work
        uses: ./
        with:
          swiftui: ${{ runner.temp }}/clean
          designs: ${{ runner.temp }}/design

      - name: The action fails the seeded app
        id: seeded
        continue-on-error: true
        uses: ./
        with:
          swiftui: scripts/eval/reallife/fixture

      - name: It must have failed
        if: steps.seeded.outcome != 'failure'
        run: |
          echo "::error::the action passed an app with seeded HIG violations"
          exit 1
